<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PlusSizeBeauty app preview and branded QR code for easy mobile access." />
    <title>App Preview | PlusSizeBeauty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <main class="app-page">
      <section class="phone-shell">
        <div class="phone-header">
          <div class="brand app-brand">
            <span class="brand-mark">PlusSize</span>
            <span class="brand-word">Beauty</span>
          </div>
          <div class="mini-icons">
            <span>◎</span>
            <span>◌</span>
            <span>🛍</span>
          </div>
        </div>

        <div class="app-hero-card">
          <div class="app-hero-copy">
            <p class="eyebrow">Beauty app</p>
            <h1>Shop the glow.</h1>
            <p>Beauty, fashion, hair, and skin care all in one place.</p>
          </div>
          <div class="app-hero-graphic">
            <div class="app-circle"></div>
          </div>
        </div>

        <div class="app-tabs">
          <span class="tab active">Home</span>
          <span class="tab">Beauty</span>
          <span class="tab">Shop</span>
          <span class="tab">Profile</span>
        </div>

        <div class="app-grid">
          <div class="app-item"></div>
          <div class="app-item"></div>
          <div class="app-item"></div>
          <div class="app-item"></div>
        </div>
      </section>

      <section class="qr-card">
        <div class="qr-header">
          <div class="brand qr-brand">
            <span class="brand-mark">PlusSize</span>
            <span class="brand-word">Beauty</span>
          </div>
        </div>

        <div class="qr-box">
          <img src="qr-code.svg" alt="PlusSizeBeauty QR code" class="qr-image" />
        </div>

        <p>Scan to open the store</p>
      </section>
    </main>
  </body>
</html>
