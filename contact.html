<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reach out to Plus-Size Beauty for questions, support, or styling inspiration." />
    <title>Contact | Plus-Size Beauty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Plus-Size Beauty home">
          <span class="brand-mark">PlusSize</span>
          <span class="brand-word">Beauty</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="fashion.html">Fashion</a>
          <a href="beauty.html">Beauty</a>
          <a href="skin-care.html">Skin Care</a>
          <a href="hair-care.html">Hair Care</a>
          <a href="style-guides.html">Style Guides</a>
          <a href="our-story.html">Our Story</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>

        <a href="shop.html" class="cart-button" aria-label="Shopping cart">
          Cart <span class="cart-count">0</span>
        </a>
      </div>
    </header>

    <main>
      <section class="page-banner">
        <div class="container page-banner-inner">
          <p class="eyebrow">Contact</p>
          <h1>We’d love to hear from you.</h1>
        </div>
      </section>

      <section class="content-section">
        <div class="container contact-grid">
          <div class="contact-info">
            <h3>Get in touch</h3>
            <p>Email: hello@plussizebeauty.com</p>
            <p>Phone: (213) 555-0199</p>
            <p>Hours: Mon–Fri, 9:00 AM – 5:00 PM</p>
          </div>

          <form class="contact-form">
            <label>
              Name
              <input type="text" placeholder="Your name" />
            </label>
            <label>
              Email
              <input type="email" placeholder="Your email" />
            </label>
            <label>
              Message
              <textarea rows="5" placeholder="How can we help?"></textarea>
            </label>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div class="brand footer-brand">
          <span class="brand-mark">PlusSize</span>
          <span class="brand-word">Beauty</span>
        </div>

        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="contact.html">Contact</a>
        </div>

        <form class="newsletter" aria-label="Newsletter signup">
          <input type="email" placeholder="Email address" aria-label="Email address" />
          <button type="submit">Join</button>
        </form>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
